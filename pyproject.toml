[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-lm"
version = "0.1.0"
description = "CPU-first compiled language-model inference research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
conversion = [
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "torch>=2.1",
  "transformers>=4.40",
]
dev = ["pytest>=8"]

[project.scripts]
engram = "engram.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_model: requires a trained Hugging Face model",
]
